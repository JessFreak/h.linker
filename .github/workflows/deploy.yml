name: CI/CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter (ignoring .spec.ts)
        run: npm run lint

      - name: Run Tests
        run: npm run test

  deploy:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Execute SSH commands on Azure Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd hlinker
            git pull origin main
            docker compose build --no-cache
            docker compose up -d
            
            docker image prune -f